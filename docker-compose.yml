version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: scanwaste-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=waste_classification
    volumes:
      - mongodata:/data/db
    networks:
      - scanwaste-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanwaste-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/waste_classification
      - JWT_SECRET=waste_classification_docker_secret_key_2026
      - JWT_EXPIRES_IN=15m
      - MAX_FILE_SIZE=5242880
      - UPLOAD_DIR=uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - scanwaste-network

volumes:
  mongodata:
  uploads_data:

networks:
  scanwaste-network:
    driver: bridge
