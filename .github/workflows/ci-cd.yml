name: ScanWaste Backend CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # JOB 1: Automated Testing & Quality Gate
  # =========================================================================
  test:
    name: 🧪 Automated Testing
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🐍 Setup Python 3.11 for AI Inference Service
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai_service/requirements.txt'

      - name: 📦 Cài đặt Node dependencies (clean install)
        run: npm ci

      - name: 📦 Cài đặt Python AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt

      - name: 🔬 Chạy AI Inference Engine Direct Test
        run: python ai_service/test_inference.py

      - name: 🚀 Khởi động AI Inference Microservice (FastAPI + TFLite)
        run: |
          python -m uvicorn main:app --app-dir ai_service --port 5005 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5005/health | grep -q "healthy"; then
              echo "✅ AI Inference Service is UP and healthy on port 5005"
              break
            fi
            echo "Waiting for AI service on port 5005... ($i/30)"
            sleep 1
          done

      - name: 🔬 Chạy Unit Tests (AI Adapter & Logic cô lập)
        run: npm run test:unit

      - name: 🔐 Chạy Auth API Tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          OTP_SECRET: ci_pipeline_otp_secret_key_2026
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_auth_test
        run: npm run test:auth

      - name: 🔐 Chạy Social Auth Security Tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          OTP_SECRET: ci_pipeline_otp_secret_key_2026
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_social_test
        run: npm run test:social

      - name: 🔄 Redis sessions and email OTP integration tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          OTP_SECRET: ci_pipeline_otp_secret_key_2026
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_session_test
        run: npm run test:session && npm run test:registration && npm run test:login-otp

      - name: 🗺️ Station API integration tests (UC005, UC006, UC012)
        env:
          REDIS_URL: redis://127.0.0.1:6379
          OTP_SECRET: ci_pipeline_otp_secret_key_2026
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_stations_test
        run: npm run test:stations

      - name: 👤 User Profile integration tests (UC009, UC010, UC011, UC014)
        env:
          REDIS_URL: redis://127.0.0.1:6379
          OTP_SECRET: ci_pipeline_otp_secret_key_2026
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_profile_test
        run: npm run test:profile

      - name: 🌐 Chạy Integration / API Tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_pipeline_super_secret_jwt_key_2026
          OTP_SECRET: ci_pipeline_otp_secret_key_2026
          JWT_EXPIRES_IN: 15m
          MAX_FILE_SIZE: 5242880
          UPLOAD_DIR: uploads
          AI_SERVICE_URL: http://127.0.0.1:5005
          PYTHON_BIN: python
        run: npm run test:integration

  # =========================================================================
  # JOB 2: Kiểm tra tính toàn vẹn của Dockerfile & Build Container
  # =========================================================================
  docker-check:
    name: 🐳 Verify Docker Build & Compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Docker Image (syntax & dependencies)
        run: docker build -t scanwaste-be:ci-check .

      - name: 🔨 Build AI Service Docker Image
        run: docker build -f ai_service/Dockerfile -t scanwaste-ai:ci-check .

      - name: 🔬 Verify model inference inside AI image
        run: docker run --rm --entrypoint python scanwaste-ai:ci-check ai_service/test_inference.py

      - name: 🐳 Validate Standard Docker Compose configuration
        env:
          JWT_SECRET: ci-only-compose-validation-secret
          OTP_SECRET: ci-only-otp-validation-secret
        run: docker compose config --quiet

      - name: 🐳 Validate Production Docker Compose configuration
        env:
          JWT_SECRET: ci-only-compose-validation-secret
          OTP_SECRET: ci-only-otp-validation-secret
        run: docker compose -f docker-compose.prod.yml config --quiet

  # =========================================================================
  # JOB 3: Build & Publish Container Images to GitHub Container Registry (GHCR)
  # =========================================================================
  publish-images:
    name: 📦 Publish Container Images to GHCR
    runs-on: ubuntu-latest
    needs: [test, docker-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker Meta for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 🚀 Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏷️ Docker Meta for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ai-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 🚀 Build and Push AI Service Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai_service/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 4: Continuous Deployment (Tự động deploy lên môi trường Production)
  # =========================================================================
  deploy:
    name: 🚀 Continuous Deployment
    runs-on: ubuntu-latest
    needs: [test, docker-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # Phương thức 1: Deploy qua SSH lên VPS / Cloud Server (khi có SSH_HOST cấu hình)
      - name: 🌐 Deploy to VPS via SSH
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying ScanWaste Backend on remote server..."
            TARGET_DIR="${{ secrets.DEPLOY_DIR || '/opt/scanWaste-be' }}"
            if [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              chmod +x scripts/deploy-prod.sh || true
              ./scripts/deploy-prod.sh
            else
              echo "Directory $TARGET_DIR does not exist yet. Please clone repository first."
              exit 1
            fi

      # Phương thức 2: Deploy qua Webhook (Render / Railway / Koyeb / CapRover / Portainer)
      - name: 🔗 Trigger Deploy via Webhook
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment webhook..."
          curl -f -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
          echo "✅ Webhook successfully triggered!"

      - name: 📢 Báo cáo trạng thái Pipeline
        run: |
          echo "### 🚀 ScanWaste Backend CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Testing Gate:** ✅ All unit, auth, stations, social & profile tests PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker & Compose:** ✅ Verification PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Ready:** ✅ Production ready" >> $GITHUB_STEP_SUMMARY
