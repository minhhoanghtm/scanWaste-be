name: ScanWaste CI/CD Pipeline

on:
  # 1. Kích hoạt kiểm thử khi tạo hoặc cập nhật Pull Request vào các nhánh chính (Kiểm thử trước khi merge)
  pull_request:
    branches:
      - main
      - master
      - develop
    types: [opened, synchronize, reopened]

  # 2. Kích hoạt khi code được merge (hoặc push trực tiếp) vào các nhánh chính
  push:
    branches:
      - main
      - master
      - develop

  # 3. Cho phép kích hoạt thủ công từ tab Actions trên GitHub (Run workflow)
  workflow_dispatch:

# Tự động hủy pipeline cũ nếu có commit mới được push lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Chạy kiểm thử tự động (Unit Test & Integration Test)
  # =========================================================================
  test:
    name: 🧪 Automated Testing
    runs-on: ubuntu-latest

    # Khởi tạo container MongoDB 7.0 cho môi trường test
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🐍 Setup Python 3.11 for AI Inference Service
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai_service/requirements.txt'

      - name: 📦 Cài đặt Node dependencies (clean install)
        run: npm ci

      - name: 📦 Cài đặt Python AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt

      - name: 🔬 Chạy AI Inference Engine Direct Test
        run: python ai_service/test_inference.py

      - name: 🚀 Khởi động AI Inference Microservice (FastAPI + TFLite)
        run: |
          python -m uvicorn main:app --app-dir ai_service --port 5005 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5005/health | grep -q "healthy"; then
              echo "✅ AI Inference Service is UP and healthy on port 5005"
              break
            fi
            echo "Waiting for AI service on port 5005... ($i/30)"
            sleep 1
          done

      - name: 🔬 Chạy Unit Tests (AI Adapter & Logic cô lập)
        run: npm run test:unit

      - name: 🌐 Chạy Integration / API Tests (14 scenarios & DB)
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/scanwaste_test
          JWT_SECRET: ci_pipeline_super_secret_jwt_key_2026
          JWT_EXPIRES_IN: 7d
          MAX_FILE_SIZE: 5242880
          UPLOAD_DIR: uploads
          AI_SERVICE_URL: http://127.0.0.1:5005
          PYTHON_BIN: python
        run: npm run test:integration

  # =========================================================================
  # JOB 2: Kiểm tra tính toàn vẹn của Dockerfile & Build Container
  # =========================================================================
  docker-check:
    name: 🐳 Verify Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Docker Image (kiểm tra syntax & dependencies)
        run: docker build -t scanwaste-be:ci-check .

      - name: 🔨 Build AI Service Docker Image
        run: docker build -t scanwaste-ai:ci-check ./ai_service

      - name: 🐳 Validate Docker Compose configuration
        run: docker compose config --quiet

  # =========================================================================
  # JOB 3: Continuous Deployment (Tự động chạy sau khi merge vào nhánh main)
  # =========================================================================
  deploy:
    name: 🚀 Continuous Deployment
    runs-on: ubuntu-latest
    needs: [test, docker-check]
    # Chỉ chạy deploy khi code đã được merge vào nhánh main (không chạy trên Pull Request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📢 Thông báo hoàn tất kiểm thử
        run: |
          echo "========================================================="
          echo "✅ Tất cả các bài kiểm thử đã PASS thành công trên branch main!"
          echo "🚀 Sẵn sàng trigger deployment lên môi trường production."
          echo "========================================================="

      # --- VÍ DỤ CÁC PHƯƠNG THỨC DEPLOY TIÊU BIỂU (Bỏ comment để dùng) ---
      #
      # Cách 1: Webhook Deploy (Render / Railway / Koyeb)
      # - name: Trigger Deploy via Webhook
      #   run: |
      #     curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
